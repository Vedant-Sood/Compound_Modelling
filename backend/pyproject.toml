[project]
name = "chemmodel"
version = "0.1.0"
description = "Chemical Modelling scientific backend"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.15",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2",
  "pyscf>=2.6",
  "ase>=3.23",
  "spglib>=2.4",
  "rdkit>=2024.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Only needed to regenerate chemmodel/data/elements.json
data = ["pymatgen-core", "mendeleev"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chemmodel*"]

[tool.setuptools.package-data]
chemmodel = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
